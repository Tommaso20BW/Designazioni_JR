name: Controlla Designazioni

on:
  workflow_dispatch:

concurrency:
  group: designazioni-jr-${{ github.ref }}
  cancel-in-progress: false

permissions:
  actions: write
  contents: write

jobs:
  controlla:
    name: Controlla designazioni
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Scarica il repository
        uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa le dipendenze
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Installa Chromium per Playwright
        run: python -m playwright install chromium

      - name: Controlla designazioni
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u arbitri.py

      - name: Salva lo storico
        if: always()
        env:
          TARGET_REF: ${{ github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -n "$(git status --porcelain -- data/designazioni.json)" ]]; then
            git config user.name "designazioni-jr-bot[bot]"
            git config user.email "designazioni-jr-bot[bot]@users.noreply.github.com"

            git add data/designazioni.json
            git commit -m "chore: aggiorna storico designazioni"
          else
            echo "Nessuna modifica allo storico."
          fi

          git pull --rebase origin "$TARGET_REF"
          git push origin "HEAD:$TARGET_REF"

      - name: Pulisci la cronologia dei run
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP: "0"
        shell: bash
        run: |
          set -euo pipefail

          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/arbitri.yml/runs?status=completed&per_page=100" \
            --jq '.workflow_runs | sort_by(.created_at) | reverse | .['"$KEEP"':] | .[].id' |
          while read -r RUN_ID; do
            if [[ -n "$RUN_ID" ]]; then
              gh api --method DELETE \
                "repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" || true
            fi
          done

          echo "Pulizia completata."
