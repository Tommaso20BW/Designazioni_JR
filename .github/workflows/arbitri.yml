name: Controlla Designazioni

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: arbitri-jr
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cache Playwright
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Installa browser Playwright
        run: python -m playwright install chromium

      - name: Controlla designazioni
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u arbitri.py

      - name: Salva storico
        run: |
          if git diff --quiet -- data/designazioni.json; then
            echo "Nessun aggiornamento dello storico."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/designazioni.json
          git commit -m "Aggiorna storico designazioni"
          git push

      - name: Elimina vecchi run
        uses: actions/github-script@v7
        with:
          script: |
            const runs = await github.paginate(
              github.rest.actions.listWorkflowRunsForRepo,
              {
                owner: context.repo.owner,
                repo: context.repo.repo,
                per_page: 100
              }
            );

            const currentRunId = context.runId;

            const oldRuns = runs.filter(
              run =>
                run.id !== currentRunId &&
                run.workflow_id === context.workflow.workflow_id
            );

            console.log(`Run da eliminare: ${oldRuns.length}`);

            for (const run of oldRuns) {
              try {
                await github.rest.actions.deleteWorkflowRun({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  run_id: run.id
                });

                console.log(`Eliminato run ${run.id}`);
              } catch (error) {
                console.log(
                  `Impossibile eliminare run ${run.id}: ${error.message}`
                );
              }
            }
