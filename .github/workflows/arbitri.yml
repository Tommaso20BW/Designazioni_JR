name: Controlla Designazioni

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: arbitri-jr
  cancel-in-progress: false

jobs:
  controlla:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installa dipendenze
        run: pip install -r requirements.txt

      - name: Controlla designazioni
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
        run: python -u arbitri.py

      - name: Salva storico
        run: |
          if git diff --quiet -- data/designazioni.json; then
            echo "Nessun aggiornamento dello storico."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/designazioni.json
          git commit -m "Aggiorna storico designazioni"
          git push
